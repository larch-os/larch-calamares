#
### Larch Essentials module
#
# A second *instance* of netinstall (see settings.conf's *instances*
# section, and netinstall.conf in this same directory for the full
# format documentation -- this file only repeats what's Larch-specific).
#
# This instance offers Larch's own recommended tooling, not part of the
# base squashfs -- selected: true by default (opt-out), unlike the
# plain "Extra Software" instance (docker/incus/chromium), which is
# opt-in. Everything here installs over the network at install time,
# same as the plain extras: never baked into the live ISO, so unchecking
# something here keeps the installed system exactly as minimal as
# packages.x86_64 plus whatever's left checked.
#
# paru-bin is deliberately NOT here: it stays in larch-base's
# packages.x86_64 instead, live and installed alike, so it's available
# to build other AUR packages *during* the install itself (e.g. from
# this very page, if network is up) rather than only after a reboot.
---
groupsUrl: local
required: false

label:
    sidebar: "Larch Essentials"
    title: "Recommended for a proper Larch experience -- uncheck anything you don't want"

groups:
    # One visible group, one checkbox per package -- same pattern as
    # netinstall.conf's "Extras" group, just with critical: false /
    # try_install (skip-and-warn, not abort) and selected: true
    # (opt-out instead of opt-in) inherited by every subgroup below.
    - name: "Larch Essentials"
      description: "Recommended packages for a proper Larch experience"
      hidden: false
      selected: true
      critical: false
      expanded: true
      subgroups:
        - name: "chezmoi"
          description: "Dotfile manager"
          selected: true
          packages:
            - chezmoi
        - name: "pass"
          description: "Standard unix password manager"
          selected: true
          packages:
            - pass
        - name: "Pika Backup"
          description: "Backup tool built on Borg"
          selected: true
          packages:
            - pika-backup
        - name: "htop"
          description: "Interactive process viewer"
          selected: true
          packages:
            - htop
        - name: "btop"
          description: "Resource monitor with graphs"
          selected: true
          packages:
            - btop
        - name: "lazygit"
          description: "Terminal UI for git"
          selected: true
          packages:
            - lazygit
        - name: "uv"
          description: "Python package and project manager"
          selected: true
          packages:
            - uv
        - name: "k3d and kubectl"
          description: "Lightweight local Kubernetes, and its CLI"
          selected: true
          packages:
            - k3d-bin
            - kubectl
        - name: "herdr"
          description: "Terminal runtime for coding agents"
          selected: true
          packages:
            - herdr-bin
