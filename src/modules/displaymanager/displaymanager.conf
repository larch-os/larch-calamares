#
# Configure one or more display managers (e.g. SDDM)
# with a "best effort" approach.
#
# This module also sets up autologin, if the feature is enabled in
# globalstorage (where it would come from the users page).
---
# The DM module attempts to set up all the DMs found in this list, in the
# precise order listed. The displaymanagers list can also be set in
# globalstorage, and in that case it overrides the setting here.
#
# If *sysconfigSetup* is set to *true* (see below, only relevant for
# openSUSE derivatives) then this list is ignored and only sysconfig
# is attempted. You can also list "sysconfig" in this list instead.
#
# Larch only ever ships greetd (see packages.x86_64) -- the other entries
# upstream supports are dead config here, trimmed rather than left as
# knobs for DMs that can never actually be installed.
displaymanagers:
  - greetd

# Enable the following settings to force a desktop environment
# in your displaymanager configuration file. This will attempt
# to configure the given DE (without checking if it is installed).
# The DM configuration for each potential DM may **or may not**
# support configuring a default DE, so the keys are mandatory
# but their interpretation is up to the DM configuration.
#
# Subkeys of *defaultDesktopEnvironment* are (all mandatory):
#  - *executable* a full path to an executable
#  - *desktopFile* a .desktop filename
#
# If this is **not** set, then Calamares will look for installed
# DE's and pick the first one it finds that is actually installed.
#
# If this **is** set, and the *executable* key doesn't point to
# an installed file, then the .desktop file's TryExec key is
# used instead.
#

# niri isn't in Calamares' built-in desktop_environments list (main.py),
# so find_desktop_environment() would return None for it -- required
# here, not optional, since DMgreetd.set_autologin() has no None-guard
# on default_desktop_environment (unlike DMsddm).
defaultDesktopEnvironment:
    executable: "/usr/bin/niri"
    desktopFile: "niri"

# greetd's own package creates its "greeter" user/group automatically via
# a sysusers.d fragment (applied by the systemd-sysusers pacman hook the
# moment greetd is pacstrapped), so basic_setup()'s useradd/groupadd is a
# no-op in practice -- left true anyway for correctness rather than
# silently-never-run.
basicSetup: true

# If true, setup autologin for openSUSE. This only makes sense on openSUSE
# derivatives or other systems where /etc/sysconfig/displaymanager exists.
#
# The preferred way to pick sysconfig is to just list it in the
# *displaymanagers* list (as the only one).
#
sysconfigSetup: false

# greeter_user/greeter_group match greetd's own sysusers.d-created account
# (confirmed via its actual Arch packaging: "u greeter - ... " with no
# explicit group, so sysusers defaults to a same-named "greeter" group) --
# not Calamares' own class default of "greetd" for the group, which
# doesn't correspond to anything greetd's package actually creates.
#
# No greeter_css_location here: that key only matters for gtkgreet's `-s
# <path>` CLI flag (see main.py's DMgreetd.set_autologin gtkgreet branch).
# ReGreet -- what Larch actually uses -- auto-loads /etc/greetd/regreet.css
# by directory convention with no flag needed, shipped statically via
# larch-base's airootfs overlay (unpackfs carries it into the target
# unchanged, same as the GRUB theme).
greetd:
  greeter_user: "greeter"
  greeter_group: "greeter"
